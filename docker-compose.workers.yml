version: '3.8'

services:
  # Neo4j 数据库服务 (Graph Worker 依赖)
  neo4j:
    image: neo4j:5.28.1
    container_name: drudge-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/niuniuniu
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_db_tx__log_rotation_retention__policy=1 files
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "niuniuniu", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Ingest Worker - 新闻数据获取服务
  ingest-worker:
    build:
      context: ./packages/ingest-worker
      dockerfile: Dockerfile
    container_name: drudge-ingest-worker
    restart: unless-stopped
    ports:
      - "39110:39110"
    environment:
      - PORT=39110
      - NODE_ENV=production
      - STORAGE_PATH=/app/data
      - NEWS_API_URL=https://news.futunn.com/news-site-api/main/get-flash-list
      - NEWS_API_PAGE_SIZE=50
      - NEWS_API_REQUEST_INTERVAL=1000
      - ENABLE_WEBHOOK_NOTIFICATION=true
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/ingest-worker.log
    volumes:
      - ingest_data:/app/data
      - ingest_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:39110/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - drudge-network

  # Graph Worker - 知识图谱处理服务
  graph-worker:
    build:
      context: ./packages/graph-worker
      dockerfile: Dockerfile
    container_name: drudge-graph-worker
    restart: unless-stopped
    ports:
      - "39111:39111"
    environment:
      - PORT=39111
      - NODE_ENV=production
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=niuniuniu
      - NEO4J_DATABASE=neo4j
      - AI_PROVIDER=deepseek
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=deepseek-reasoner
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_MODEL=gemini-1.5-flash
      - NEWS_DIRECTORY=/app/data/news
      - BATCH_SIZE=10
      - RETRY_ATTEMPTS=3
      - RETRY_DELAY=1000
      - ENABLE_WEBHOOK_NOTIFICATION=true
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - LOG_LEVEL=info
      - LOG_FORMAT=combined
    volumes:
      - graph_data:/app/data
      - graph_logs:/app/logs
      - graph_backup:/app/backup
      # 共享新闻数据目录
      - ingest_data:/app/shared_data:ro
    depends_on:
      neo4j:
        condition: service_healthy
      ingest-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:39111/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - drudge-network

networks:
  drudge-network:
    driver: bridge
    name: drudge-network

volumes:
  neo4j_data:
    name: drudge_neo4j_data
  neo4j_logs:
    name: drudge_neo4j_logs
  ingest_data:
    name: drudge_ingest_data
  ingest_logs:
    name: drudge_ingest_logs
  graph_data:
    name: drudge_graph_data
  graph_logs:
    name: drudge_graph_logs
  graph_backup:
    name: drudge_graph_backup 